name: Validate DROPPS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            extra: openmm81
          - python: '3.10'
            extra: latest
          - python: '3.12'
            extra: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[${{ matrix.extra }},dev]' 'poetry-core>=2,<3'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/update_readme_commands.py --check
      - run: python scripts/update_command_docs.py --check
      - run: python examples/colab/validate_notebooks.py
      - run: ruff check --isolated --select E9,F63,F7,F82 --exclude backups,'._*' dropps scripts tests examples/colab
      - if: matrix.python == '3.12'
        run: python scripts/prepare_release.py --expected-version 1.0.0 --skip-tests
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/1.0.0/
