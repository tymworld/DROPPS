name: Test DROPPS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install DROPPS and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[latest]' ruff
      - name: Test source and command workflows
        run: python -m unittest discover -s tests -v
      - name: Check syntax and formatting
        run: |
          python -m compileall -q dropps tests scripts
          ruff check dropps tests scripts
          ruff format --check dropps tests scripts
      - name: Validate Colab notebooks
        run: python examples/colab/validate_notebooks.py
