[project]
name = "dropps"
version = "1.0.0"
description = "Distributed Rapid Operation Platform for Phase-separation Simulations"
authors = [
    {name = "Yiming Tang",email = "ymtang@fudan.edu.cn"}
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.4,<2; python_version < '3.10'",
    "numpy>=1.26.4,<3; python_version >= '3.10'",
    "openmm>=8.1,<8.2; python_version < '3.10'",
    "openmm>=8.1,<9; python_version >= '3.10'",
    "MDAnalysis>=2.7,<2.8; python_version < '3.10'",
    "MDAnalysis>=2.9; python_version >= '3.10'",
    "tqdm (>=4.67)",
    "biopython (>=1.80)",
    "scipy",
    "tidynamics>=1.1",
    "pandas",
    "openpyxl",
    "gsd"
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
latest = [
    "numpy>=2,<3; python_version >= '3.10'",
    "openmm>=8.5,<9; python_version >= '3.10'",
]
cuda12 = [
    "numpy>=2,<3; python_version >= '3.10'",
    "openmm[cuda12]>=8.5,<9; python_version >= '3.10'",
]
cuda13 = [
    "numpy>=2,<3; python_version >= '3.10'",
    "openmm[cuda13]>=8.5,<9; python_version >= '3.10'",
]
openmm81 = [
    "numpy>=1.26.4,<2",
    "openmm>=8.1,<8.2",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.12",
]

[project.urls]
Homepage = "https://dropps.online"
Repository = "https://github.com/tymworld/DROPPS"
Documentation = "https://github.com/tymworld/DROPPS/tree/main/docs"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
dps = "dropps.dps:main"

[tool.poetry]
include = [
    {path = "CHANGELOG.md", format = "sdist"},
    {path = "docs", format = "sdist"},
    {path = "tests", format = "sdist"},
    {path = "examples", format = "sdist"},
    {path = "CITATION.cff", format = "sdist"},
    {path = "scripts", format = "sdist"},
]
exclude = [
    "**/.DS_Store",
    "**/._*",
    "**/@eaDir/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "dropps/backups/**",
    "release/**",
]
