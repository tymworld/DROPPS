[project]
name = "dropps"
version = "0.4.1"
description = "Distributed Rapid Operation Platform for Phase-separation Simulations"
authors = [
    {name = "Yiming Tang",email = "ymtang@fudan.edu.cn"}
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy (==1.26.4)",
    "openmm (==8.1.*)",
    "MDAnalysis (>=2.7.0)",
    "tqdm (>=4.67)",
    "bio (>=1.6.2)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
dps = "dropps.dps:main"
